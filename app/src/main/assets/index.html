let dc=0;const hasF=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files'),clr=()=>{dc=0;document.body.classList.remove('drg');document.querySelectorAll('.dz').forEach(x=>x.classList.remove('dz'))};

function pk(k){pickFile(async f=>{const d=await rd(f,k=='i'?1600:1800);if(!d)return nope(f.name);if(k=='i'){M.icon={t:'b',data:d};M.ix=M.iy=50;M.iz=1}else{M.banner=d;M.bx=M.by=50;M.bz=1}M.draw()})}
async function sf(){snd('ok');M.name=M.name.trim()||'Новая папка';const d={id:M.id,name:M.name,icon:M.icon,banner:M.banner,created:M.created,theme:M.theme,bx:M.bx,by:M.by,bz:M.bz,ix:M.ix,iy:M.iy,iz:M.iz,pid:M.pid||null};await put('folders',d);const j=S.folders.findIndex(x=>x.id==d.id);j<0?S.folders.push(d):S.folders[j]=d;rv('i'+d.id);rv('b'+d.id);MO.remove();S.cur?fold():home()}
async function df(){if(!await ask('Удалить папку со всеми подпапками и файлами?'))return;snd('del');selReset();const ids=[M.id];for(let i=0;i<ids.length;i++)S.folders.filter(x=>x.pid==ids[i]).forEach(x=>ids.push(x.id));for(const x of S.files.filter(x=>ids.includes(x.fid))){await del('files',x.id);rv('f'+x.id);rv('t'+x.id)}S.files=S.files.filter(x=>!ids.includes(x.fid));for(const i of ids){await del('folders',i);rv('i'+i);rv('b'+i)}S.folders=S.folders.filter(x=>!ids.includes(x.id));MO.remove();if(ids.includes(S.cur))S.cur=M.pid||null;S.cur?fold():home()}

let V={s:1,r:0,x:0,y:0},drag=null;
function view(i){snd('tap');S.vi=i;if(!$('.vw')){const w=document.createElement('div');w.className='vw';w.innerHTML=`<div class=st id=st><div class=bk id=bk></div><div class=md id=md></div><button class="btn nv l" onclick="nav(-1)">‹</button><button class="btn nv r" onclick="nav(1)">›</button><div class=tb><button class=btn onclick="zm(1/1.25)">➖</button><button class=btn onclick="zm(1.25)">➕</button><button class="btn lav" onclick="rt(-90)">⟲</button><button class="btn lav" onclick="rt(90)">⟳</button><button class="btn yel" onclick="rs()">1:1</button><button class="btn mint" onclick="fs_()">⛶</button><button class="btn yel" title="Случайный файл" onclick="rnd()">${I.dice}</button><button class="btn red" onclick="cl()">✕</button></div></div><aside class=pn id=pn></aside>`;document.body.appendChild(w);
const st=$('#st');st.onwheel=e=>{e.preventDefault();zm(e.deltaY<0?1.15:1/1.15)};const P=new Map();let pd=0;const dist=()=>{const[a,b]=[...P.values()];return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)};
st.onpointerdown=e=>{if(e.target.closest('.btn,video'))return;P.set(e.pointerId,e);if(P.size==1)drag={x:e.clientX-V.x,y:e.clientY-V.y,sx:e.clientX,sy:e.clientY};else{drag=null;pd=dist()}$('#md').classList.add('dr');st.setPointerCapture(e.pointerId)};
st.onpointermove=e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,e);if(P.size==2){const d=dist();if(pd)zm(d/pd);pd=d}else if(drag){V.x=e.clientX-drag.x;V.y=e.clientY-drag.y;ap()}};
st.onpointerup=st.onpointercancel=e=>{if(!P.delete(e.pointerId))return;if(drag&&!P.size){const dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;if(V.s<=1.05&&Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){drag=null;nav(dx<0?1:-1)}else if(Math.hypot(dx,dy)<8)$('.vw').classList.toggle('hid')}if(!P.size){drag=null;$('#md').classList.remove('dr')}pd=0};st.ondblclick=e=>{if(!e.target.closest('.btn'))V.s>1?rs():zm(2.5)}}show()}

const zm=k=>{V.s=Math.min(10,Math.max(.2,V.s*k));ap()},rt=d=>{V.r+=d;ap()},rs=()=>{V={s:1,r:0,x:0,y:0};ap()};
